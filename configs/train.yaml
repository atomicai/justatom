method: vanilla

experiment:
  role: canonical
  seed: 42

model:
  name_or_path: intfloat/multilingual-e5-small
  query_prefix: "query:"
  content_prefix: "passage:"
  max_query_seq_len: null
  max_seq_len: 512
  lora:
    enabled: false
    rank: 16
    alpha: 32
    dropout: 0.0
    target_modules: all-linear
    use_rslora: true
    bias: none

dataset:
  id: null
  name_or_path: null
  lazy: true
  config: null
  labels_field: queries
  content_field: content
  split: null
  limit: null
  chunk_id_col: null
  keywords_col: keywords_or_phrases
  keywords_nested_col: null
  explanation_nested_col: null
  drop_columns: null

filters:
  fields: null

optimization:
  optimizer: adamw
  lr_encoder: 0.00002
  lr_heads: 0.01
  weight_decay: 0.01
  batch_size: 32
  grad_acc_steps: 1
  epochs: 1
  num_samples: 100

# Explicit values in these sections override the selected method profile.
objective: {}
alpha_gate: {}
memory_bank: {}
gradient_projection: {}
reranker:
  enabled: false
  backend: transformers
  model_name_or_path: Qwen/Qwen3-Reranker-4B
  revision: 22e683669bc0f0bd69640a1354a6d0aebcfeede5
  instruction: Given a web search query, retrieve relevant passages that answer the query
  device: auto
  dtype: auto
  local_files_only: true
  max_length: 512
  batch_size: 4
  prefilter_hard_negatives: 32
  prefilter_random_negatives: 8
  negatives: 12
  min_score_gap: 0.1
  strategy: filter
  teacher_temperature: 0.05
  teacher_weight_floor: 0.0001
  cache:
    mode: read-write
    path: .cache/justatom/reranker.sqlite
    on_miss: score

telemetry:
  backend: csv
  metrics_path: null
  wandb_project: justatom
  run_name: null

artifacts:
  save_dir: null
  collection_name: null
  collection_tag: null
  save_research_checkpoint: true

runtime:
  accelerator: auto
  devices: auto
  precision: auto
  gradient_checkpointing: false

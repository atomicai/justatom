# Encoder recipe. Supply the prepared training dataset explicitly.
method: atomic
experiment:
  role: ablation
  seed: 42
model:
  name_or_path: nvidia/Nemotron-3-Embed-1B-BF16
  revision: c0c9fea93ea424587517f2c59e20db9f1d6bf615
  dtype: bfloat16
  query_prefix: "query: "
  content_prefix: "passage: "
  max_query_seq_len: 192
  max_seq_len: 512
  lora:
    enabled: true
    rank: 16
    alpha: 32
    dropout: 0.05
    target_modules: all-linear
    use_rslora: true
    bias: none
optimization:
  lr_encoder: 0.00002
  batch_size: 2
  grad_acc_steps: 16
  epochs: 1
  num_samples: -1
objective:
  decoupled: false
  temperature: 0.05
  learnable_temperature: true
memory_bank:
  enabled: false
  size: 0
anchor_bank:
  enabled: true
  size: 512
  warmup_steps: 5
  temperature: 0.05
gradient_projection:
  enabled: true
  memory_weight: 0.0
runtime:
  accelerator: auto
  devices: 1
  precision: bf16-mixed
  gradient_checkpointing: true

method: atomic

experiment:
  role: ablation
  seed: 42

model:
  name_or_path: Qwen/Qwen3-VL-Embedding-2B
  revision: 9f2f7e710d6d81056aa5c0a4f04764fec6bb7bda
  dtype: bfloat16
  # Same formatting and optimization as the matched vanilla config.
  query_prefix: ""
  content_prefix: ""
  max_query_seq_len: 128
  max_seq_len: 512
  lora:
    enabled: true
    rank: 16
    alpha: 32
    dropout: 0.05
    target_modules: all-linear
    use_rslora: true
    bias: none

dataset:
  id: justatom

optimization:
  lr_encoder: 0.00002
  batch_size: 4
  grad_acc_steps: 8
  epochs: 1
  num_samples: 3000

objective:
  decoupled: false
  temperature: 0.05
  simcse_dropout_weight: 0.0

memory_bank:
  enabled: false
  size: 0
  warmup_steps: 0
  mining: all
  random_negatives: 0

anchor_bank:
  enabled: true
  size: 512
  warmup_steps: 5
  temperature: 0.05

gradient_projection:
  enabled: true
  memory_weight: 0.0
  eps: 1.0e-12

artifacts:
  save_dir: weights/qwen3-vl-2b-lora-geometry-anchor-bank
  save_research_checkpoint: false

runtime:
  accelerator: auto
  devices: 1
  precision: auto
  gradient_checkpointing: true

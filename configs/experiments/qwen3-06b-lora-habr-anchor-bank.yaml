method: atomic

experiment:
  role: ablation
  seed: 42

model:
  name_or_path: Qwen/Qwen3-Embedding-0.6B
  query_prefix: "Instruct: Given a web search query, retrieve relevant passages that answer the query\nQuery: "
  content_prefix: ""
  max_query_seq_len: 128
  max_seq_len: 512
  lora:
    enabled: true
    rank: 16
    alpha: 32
    dropout: 0.05
    target_modules: all-linear
    use_rslora: true
    bias: none

dataset:
  id: habr-ir

optimization:
  lr_encoder: 0.00002
  batch_size: 8
  grad_acc_steps: 4
  epochs: 1
  num_samples: -1

objective:
  decoupled: false
  temperature: 0.05
  simcse_dropout_weight: 0.0

memory_bank:
  enabled: false
  size: 0

anchor_bank:
  enabled: true
  size: 512
  warmup_steps: 5
  temperature: 0.05

gradient_projection:
  enabled: true
  memory_weight: 0.0
  eps: 1.0e-12

runtime:
  accelerator: auto
  devices: 1
  precision: auto
  gradient_checkpointing: true

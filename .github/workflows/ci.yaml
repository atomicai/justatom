name: Continuous integration

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  format-check:
    name: Format check (black + isort)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        architecture: 'x64'
    - name: Install black and isort
      run: |
        python -m pip install --upgrade pip
        python -m pip install black==24.10.0 isort==5.13.2
    - name: Run format checks
      run: |
        git ls-files -z '*.py' | xargs -0 black --check --diff
        git ls-files -z '*.py' | xargs -0 isort --check-only --diff
  lint:
    name: Lint (pylint+mypy)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        architecture: 'x64'
    - name: Install lint tools
      run: |
        python -m pip install --upgrade pip
        python -m pip install pylint==4.0.6 mypy==2.3.0
    - name: Lint
      run: |
        pylint justatom --errors-only --disable=import-error,not-callable
        mypy \
          justatom/training/config.py \
          justatom/training/methods.py \
          justatom/training/alpha_gate.py \
          justatom/training/memory_bank.py \
          justatom/training/anchor_bank.py \
          justatom/training/gradient_projection.py \
          justatom/training/objective.py \
          justatom/training/sampling.py \
          justatom/training/telemetry.py \
          justatom/training/module.py \
          justatom/training/data.py \
          justatom/training/job.py \
          --ignore-missing-imports \
          --follow-imports=skip
  pytest-ubuntu:
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.10', '3.11', '3.12', '3.13' ]
    name: Tests (Ubuntu, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install requirements
      run: |
        python -m pip install --upgrade pip
        python -m pip install ".[torch,serve,test]"
    - name: Run tests
      run: python -m pytest tests -m "not integration and not network"
  pytest-windows:
    name: Tests (Windows)
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install requirements
      run: |
        python -m pip install --upgrade pip
        python -m pip install ".[torch,serve,test]"
    - name: Run tests
      shell: bash
      run: python -m pytest tests -m "not integration and not network"
  pytest-macos:
    name: Tests (MacOS)
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install supported Bash
      run: |
        brew install bash
        echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
    - name: Install requirements
      run: |
        python -m pip install --upgrade pip
        python -m pip install ".[torch,serve,test]"
    - name: Run tests
      run: python -m pytest tests -m "not integration and not network"

  pytest-integration-docker-compose:
    name: Docker Compose contracts (Ubuntu)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install contract test requirements
      run: python -m pip install pytest PyYAML
    - name: Verify Docker Compose
      run: docker compose version
    - name: Run Docker Compose contract tests
      run: python -m pytest tests/test_docker_assets.py -m integration

  pytest-integration-weaviate:
    name: Integration tests (Weaviate, Ubuntu)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Start Weaviate
      run: docker compose up -d weaviate
    - name: Install requirements
      run: |
        python -m pip install --upgrade pip
        python -m pip install ".[torch,serve,test]"
    - name: Run integration tests
      run: python -m pytest tests -m integration
  build-docs:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        architecture: 'x64'
    - name: Install docs requirements
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements-docs.txt
    - name: Build docs
      run: python -m mkdocs build --strict

version: '3.4'
services:
  weaviate:
    command:
      - --host
      - 0.0.0.0
      - --port
      - '2211'
      - --scheme
      - http
    image: cr.weaviate.io/semitechnologies/weaviate:1.34.2
    ports:
      - "${WEAVIATE_HTTP_PORT:-2211}:2211"
      - "${WEAVIATE_GRPC_PORT:-50051}:50051"
    volumes:
      - weaviatedb:/var/lib/weaviate
    restart: on-failure:0
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:2211/v1/.well-known/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      QUERY_DEFAULTS_LIMIT: 2048
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      DEFAULT_VECTORIZER_MODULE: 'none'
      ENABLE_MODULES: ''
      CLUSTER_HOSTNAME: 'node1'
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: justatom-api
    ports:
      - "${JUSTATOM_API_PORT:-5555}:5555"
    environment:
      JUSTATOM_CONFIG: /etc/justatom/serve.yaml
      JUSTATOM_START_MQ: "false"
      JUSTATOM_EMBEDDING_PROFILES: ${COMPOSE_PROFILES:-external}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://embedder:8000/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
    volumes:
      - ./configs/serve.docker.yaml:/etc/justatom/serve.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      weaviate:
        condition: service_healthy
      embedder-cpu:
        condition: service_healthy
        required: false
      embedder-cuda:
        condition: service_healthy
        required: false
    restart: unless-stopped

  embedder-cpu:
    profiles: ["cpu"]
    build:
      context: .
      dockerfile: Dockerfile.embedder.cpu
    image: justatom-embedder-cpu
    ports:
      - "${EMBEDDING_PORT:-8000}:8000"
    environment:
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      EMBEDDING_DEVICE: cpu
      HF_HOME: /cache/huggingface
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - huggingface-cache:/cache/huggingface
    networks:
      default:
        aliases: ["embedder"]
    restart: unless-stopped

  embedder-cuda:
    profiles: ["cuda"]
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.embedder.cuda
    image: justatom-embedder-cuda
    ports:
      - "${EMBEDDING_PORT:-8000}:8000"
    environment:
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      EMBEDDING_DEVICE: cuda:0
      HF_HOME: /cache/huggingface
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - huggingface-cache:/cache/huggingface
    networks:
      default:
        aliases: ["embedder"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: ["gpu"]
    restart: unless-stopped

  redis:
    profiles: ["legacy"]
    image: redis:latest
    volumes:
      - ./redis.conf:/redis.conf
    ports:
      - '6379:6379'
    command: [ "redis-server", "/redis.conf" ]
volumes:
  weaviatedb:
    external: false
  huggingface-cache:

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "justatom"
version = "0.1.0"
requires-python = ">=3.10"

[project.optional-dependencies]
torch = [
  "torch==2.8.0",
  "pytorch-lightning==2.2.1",
  "torchmetrics==1.3.2",
  "transformers>=4.44,<6",
]
test = [
  "pytest>=8,<9",
  "setuptools<81",
  "lazy-imports==0.3.1",
  "fastnumbers==5.1.0",
  "json-repair==0.30.0",
  "mmh3==4.1.0",
  "more-itertools==10.1.0",
  "pandas>=2.2,<3",
  "python-dateutil==2.9.0.post0",
  "polars==1.38.1",
  "weaviate-client==4.11.3",
  "loguru==0.7.2",
  "tqdm",
  "PyYAML>=6,<7",
  "python-dotenv==1.0.0",
  "simplejson==3.19.2",
  "dotmap==1.3.30",
  "envyaml==1.10.211231",
  "jsonlines==4.0.0",
  "jarowinkler==2.0.1",
  "openai>=1,<3",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["justatom*"]

[tool.setuptools.package-data]
justatom = [
  "builtins/**/*.txt",
  "builtins/**/*.yaml",
  "builtins/**/*.jsonl",
]

[tool.pytest.ini_options]
pythonpath = [
  "."
]
testpaths = [
  "tests"
]
markers = [
  "integration: tests that require external services (e.g. Weaviate/Docker)",
  "network: tests that download external models or datasets",
]

[tool.black]
line-length = 132
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 132
py_version = 310
src_paths = ["justatom", "tests", "scripts"]
